name: shellcheck
permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # shellcheck reads sh and bash only, so zsh and other scripts are left out by shebang.
    # Only errors fail the build: older scripts still have warnings.
    - name: Lint the shell scripts
      run: |
        git ls-files install bin '*.sh' \
          | while read -r file; do
              head -n1 "$file" | grep -qE '^#!.*[/ ](ba|da)?sh$' && echo "$file"
            done \
          | xargs shellcheck --severity=error
